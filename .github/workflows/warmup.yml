name: Warm up API

# Render's free instance sleeps after ~15 minutes of inactivity; the first
# visitor then waits while it boots. A short ping keeps it awake. Delete this
# workflow (or upgrade Render) if you would rather not spend Actions minutes.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' "$HEALTH_URL")
          test "$code" = "200"
