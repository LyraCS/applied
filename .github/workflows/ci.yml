name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # Ephemeral database for the integration tests. This password is a fixed
    # throwaway value for a container that exists only for this job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: applied_ci_password
          POSTGRES_DB: applied_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:applied_ci_password@localhost:5432/applied_test
      DIRECT_URL: postgresql://postgres:applied_ci_password@localhost:5432/applied_test
      # Test-only value, never used outside this job.
      JWT_SECRET: ci-only-jwt-secret-not-a-real-credential-32ch

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run generate
      - name: Apply migrations
        run: npm exec --workspace @applied/api -- prisma migrate deploy
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
